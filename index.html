<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#06192e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>La mia musica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06192e; --panel:rgba(8,28,52,.78); --panel2:rgba(20,48,82,.9); --line:rgba(140,200,255,.18);
    --text:#f3eff8; --muted:#9c94aa; --accent:#ff7a45; --accent2:#ffb347;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#06192e}
  body{background:transparent}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
  html,body{margin:0;color:var(--text);font-family:'Outfit',system-ui,sans-serif;height:100%}
  body{display:flex;flex-direction:column;min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  header{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between}
  h1{text-shadow:0 2px 10px #0008;font-size:24px;margin:0;font-weight:700;letter-spacing:-.3px}
  h1 span{color:var(--accent)}
  .logo{margin:0;line-height:0;cursor:pointer}
  header,.tabs,.search,main,.player{transition:opacity .5s}
  body.dj-on header,body.dj-on .tabs,body.dj-on .search,body.dj-on main,body.dj-on .player{opacity:0;pointer-events:none}
  body.dj-on{overflow:hidden}
  .dj{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}
  body.dj-on .dj{display:block}
  .dj-ui{transition:opacity .4s;pointer-events:auto}
  .dj.idle .dj-ui{opacity:0;pointer-events:none}
  .dj-x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(4,18,36,.6);color:#fff;font-size:18px;backdrop-filter:blur(6px)}
  .dj-bottom{position:absolute;left:0;right:0;bottom:0;padding:20px 20px 28px;text-align:center;background:linear-gradient(transparent,rgba(2,10,22,.75))}
  .dj-title{font-size:20px;font-weight:600;text-shadow:0 2px 10px #000}
  .dj-sub{color:#c9d8ea;font-size:14px;margin-top:2px;text-shadow:0 2px 10px #000}
  .dj-ctrls{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:14px}
  .dj-ctrls .ic{color:#fff}
  .lowfx .player,.lowfx .tab,.lowfx .empty{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .lowfx .player{background:rgba(8,28,52,.93)}
  .lowfx header,.lowfx .tabs,.lowfx .search,.lowfx main,.lowfx .player{filter:none!important}
  header,.tabs,.search,main,.player{filter:brightness(calc(1 - var(--night,0) * .35))}
  .logo img{height:52px;width:auto;filter:drop-shadow(0 3px 8px #0009);animation:float 3.2s ease-in-out infinite;transform-origin:50% 80%}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
  .hdr-r{display:flex;gap:8px;align-items:center}
  .fx-btn{width:40px;height:40px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:18px}
  .fx-btn.off{opacity:.45}
  .add-btn{background:var(--accent);color:#1a0d06;font-weight:600;padding:10px 16px;border-radius:999px;display:flex;gap:6px;align-items:center}
  .tabs{display:flex;gap:8px;padding:6px 18px 10px}
  .tab{padding:8px 14px;border-radius:999px;background:var(--panel);backdrop-filter:blur(6px);color:var(--muted);font-weight:500}
  .tab.on{background:var(--text);color:var(--bg)}
  .search{margin:0 18px 10px;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:10px 12px}
  .search input{flex:1;background:none;border:0;color:var(--text);outline:none}
  main{flex:1;overflow-y:auto;padding:0 10px 200px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;background:rgba(4,18,36,.45);margin-bottom:6px}
  .row:active{background:var(--panel)}
  .row.playing .title{color:var(--accent)}
  .cover{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
  .info{flex:1;min-width:0}
  .title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .more{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .empty{text-align:center;color:#c9d8ea;padding:28px 24px;margin:40px 8px 0;line-height:1.5;background:rgba(4,18,36,.6);border-radius:18px;backdrop-filter:blur(6px)}
  .empty b{color:var(--text);display:block;font-size:18px;margin-bottom:6px}
  .back{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;color:var(--muted)}
  .pl-head{text-shadow:0 1px 6px #000a;padding:0 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pl-head h2{margin:0;font-size:22px}
  .pill{background:var(--panel2);padding:8px 14px;border-radius:999px;font-weight:500;font-size:14px}
  .pill.accent{background:var(--accent);color:#1a0d06}

  /* player */
  .player{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:fixed;left:8px;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px 14px;box-shadow:0 10px 40px #0008}
  .player.hidden{display:none}
  .p-top{display:flex;align-items:center;gap:12px}
  .p-top .cover{width:50px;height:50px}
  .bar{margin-top:12px}
  input[type=range]{width:100%;accent-color:var(--accent);height:4px}
  .times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:2px}
  .ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
  .ic.on{color:var(--accent)}
  .ic.big{width:58px;height:58px;background:var(--text);color:var(--bg)}
  .ic svg{width:24px;height:24px}
  .ic.big svg{width:28px;height:28px}

  /* sheets */
  .shade{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
  .shade.on{display:flex}
  .sheet{background:var(--panel);width:100%;border-radius:20px 20px 0 0;padding:16px 14px 26px;max-height:80vh;overflow-y:auto}
  .sheet h3{margin:4px 6px 12px;font-size:17px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 10px;border-radius:12px;font-size:16px}
  .opt:active{background:var(--panel2)}
  .opt.danger{color:#ff6b6b}
  .field{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  .note{color:var(--muted);font-size:12px;text-align:center;padding:16px 20px}
  .ripple{position:fixed;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2px solid rgba(190,240,255,.85);box-shadow:0 0 12px rgba(150,220,255,.5);pointer-events:none;z-index:50;animation:rip .75s ease-out forwards}
  .ripple.r2{animation-delay:.12s;opacity:0;border-color:rgba(255,255,255,.6)}
  @keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(8);opacity:0;border-width:.5px}}
</style>
</head>

<script>
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const DOTS='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
const $=id=>document.getElementById(id);

/* ---------- Archivio (IndexedDB, con ripiego in memoria) ---------- */
let db=null, persistent=false;
const mem={songs:new Map(),playlists:new Map()};
function openDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open('mia-musica',1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('songs',{keyPath:'id'});d.createObjectStore('playlists',{keyPath:'id'});};
      r.onsuccess=()=>{db=r.result;persistent=true;res();};
      r.onerror=()=>res();
    }catch(e){res();}
  });
}
function tx(store,mode,fn){
  if(!db) return Promise.resolve(fn(null));
  return new Promise((res,rej)=>{
    try{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);
      t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);}
    catch(e){rej(e);}
  });
}
const store={
  async all(name){ if(!db) return [...mem[name].values()]; return tx(name,'readonly',s=>s.getAll()); },
  async put(name,obj){ mem[name].set(obj.id,obj); if(db) try{await tx(name,'readwrite',s=>s.put(obj));}catch(e){toast('Spazio pieno: brano non salvato');throw e;} },
  async del(name,id){ mem[name].delete(id); if(db) await tx(name,'readwrite',s=>s.delete(id)); }
};

/* ---------- Stato ---------- */
let songs=[], playlists=[];
let view={tab:'songs',playlist:null};
let queue=[], qi=-1, shuffle=false, repeat='off'; // off | all | one
let currentUrl=null;
const audio=$('audio');

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* ---------- Tocco: cerchi, corrente d'acqua e swipe tra schede ---------- */
const fx=()=>window.waterFx||{push(){},touch(){}};
document.addEventListener('pointerdown',e=>{
  for(const c of ['ripple','ripple r2']){const r=document.createElement('div');r.className=c;
    r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),1000);}
  fx().touch(e.clientX,e.clientY);
},{passive:true});
let tStart=null,tLast=null,touching=false;
document.addEventListener('touchstart',e=>{const p=e.touches[0];touching=true;tStart=tLast={x:p.clientX,y:p.clientY};},{passive:true});

document.addEventListener('touchend',()=>{touching=false;tStart=tLast=null;},{passive:true});
const lastScroll=new WeakMap();
addEventListener('scroll',e=>{
  const el=(e.target===document||!e.target.scrollTop&&e.target.scrollTop!==0)?document.scrollingElement:e.target;
  const prev=lastScroll.has(el)?lastScroll.get(el):el.scrollTop;lastScroll.set(el,el.scrollTop);
},{capture:true,passive:true});

window.nightMode='auto';
try{if(!localStorage.getItem('mm-sky-reset')){localStorage.setItem('mm-sky','auto');localStorage.setItem('mm-sky-reset','1');}
  window.nightMode=localStorage.getItem('mm-sky')||'auto';}catch(e){}
setTimeout(()=>{const lb=document.getElementById('logoBtn');if(!lb)return;
  const order=['auto','day','dusk','night'],names={auto:'Luce automatica (segue l’ora)',day:'Sempre giorno',dusk:'Sempre tramonto',night:'Sempre notte'};
  lb.onclick=()=>{const m=order[(order.indexOf(window.nightMode)+1)%order.length];window.nightMode=m;
    try{localStorage.setItem('mm-sky',m);}catch(e){}toast(names[m]);};},0);

const fmt=s=>!isFinite(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const COLORS=[['#ff7a45','#ffb347'],['#7b5cff','#c084fc'],['#16a085','#5ee6b5'],['#e84393','#fd79a8'],['#2f80ed','#56ccf2'],['#d4a017','#ffd166']];
function coverStyle(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;const [a,b]=COLORS[h%COLORS.length];return `background:linear-gradient(135deg,${a},${b})`;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800);}

/* ---------- Aggiunta brani ---------- */
$('addBtn').onclick=()=>$('fileIn').click();
$('fileIn').onchange=async e=>{
  const files=[...e.target.files]; e.target.value='';
  if(!files.length) return;
  let n=0;
  for(const f of files){
    let base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
    let artist='', title=base;
    const m=base.split(' - ');
    if(m.length>=2){artist=m[0].trim();title=m.slice(1).join(' - ').trim();}
    const duration=await getDuration(f);
    const song={id:uid(),title,artist,duration,added:Date.now(),blob:f,type:f.type};
    try{await store.put('songs',song);songs.push(song);n++;}catch(err){break;}
  }
  if(view.playlist){const p=playlists.find(x=>x.id===view.playlist);}
  toast(n===1?'1 brano aggiunto':n+' brani aggiunti');
  render();
};
function getDuration(file){
  return new Promise(res=>{const a=new Audio();const u=URL.createObjectURL(file);
    a.preload='metadata';a.onloadedmetadata=()=>{res(a.duration);URL.revokeObjectURL(u);};
    a.onerror=()=>{res(0);URL.revokeObjectURL(u);};a.src=u;setTimeout(()=>res(0),4000);});
}

/* ---------- Pulizia: toglie i vecchi brani di prova ---------- */
let seeding=false;
async function removeTests(){
  const tests=songs.filter(x=>x.test);if(!tests.length)return;
  const ids=new Set(tests.map(x=>x.id));
  for(const x of tests){try{await store.del('songs',x.id);}catch(e){}}
  songs=songs.filter(x=>!ids.has(x.id));
  for(const p of [...playlists]){
    const had=p.songIds.some(id=>ids.has(id));if(!had)continue;
    p.songIds=p.songIds.filter(id=>!ids.has(id));
    if(!p.songIds.length&&p.name==='Brani di prova'){try{await store.del('playlists',p.id);}catch(e){}playlists=playlists.filter(x=>x.id!==p.id);}
    else{try{await store.put('playlists',p);}catch(e){}}
  }
  render();
}

/* ---------- Render ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view={tab:b.dataset.tab,playlist:null};render();});
$('search').oninput=()=>render();

function songRow(s,ctx){
  const playing=queue[qi]===s.id;
  return `<div class="row ${playing?'playing':''}" data-id="${s.id}" data-ctx="${ctx}">
    <div class="cover" style="${coverStyle(s.title)}">${esc((s.title[0]||'♪').toUpperCase())}</div>
    <div class="info"><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.artist||'Artista sconosciuto')} · ${fmt(s.duration)}</div></div>
    <button class="more" data-more="${s.id}">${DOTS}</button></div>`;
}
function filtered(list){
  const q=$('search').value.trim().toLowerCase();
  return q?list.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(q)):list;
}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===view.tab));
  $('searchBox').style.display=(view.tab==='songs'||view.playlist)?'flex':'none';
  const L=$('list'); let h='';
  if(view.tab==='songs'){
    const list=filtered([...songs].sort((a,b)=>a.title.localeCompare(b.title)));
    if(!songs.length&&seeding) h=`<div class="empty"><b>Preparo i brani di prova…</b>Ci vuole qualche secondo.</div>`;
    else if(!songs.length) h=`<div class="empty"><b>Ancora nessun brano</b>Tocca “+ Aggiungi” e scegli i file audio dal telefono (MP3, M4A…).</div>`;
    else if(!list.length) h=`<div class="empty">Nessun risultato.</div>`;
    else{h=`<div class="pl-head"><span class="sub">${songs.length} brani</span><button class="pill accent" id="playAll">▶ Riproduci tutto</button></div>`+list.map(s=>songRow(s,'all')).join('');}
  } else if(!view.playlist){
    h=`<div class="pl-head"><span class="sub">${playlists.length} playlist</span><button class="pill accent" id="newPl">+ Nuova playlist</button></div>`;
    if(!playlists.length) h+=`<div class="empty"><b>Nessuna playlist</b>Creane una e aggiungi i brani dal menu ⋮ accanto a ogni canzone.</div>`;
    h+=playlists.map(p=>`<div class="row" data-pl="${p.id}"><div class="cover" style="${coverStyle(p.name)}">♫</div>
      <div class="info"><div class="title">${esc(p.name)}</div><div class="sub">${p.songIds.length} brani</div></div>
      <button class="more" data-plmore="${p.id}">${DOTS}</button></div>`).join('');
  } else {
    const p=playlists.find(x=>x.id===view.playlist);
    if(!p){view.playlist=null;return render();}
    const list=filtered(p.songIds.map(id=>songs.find(s=>s.id===id)).filter(Boolean));
    h=`<button class="back" id="backBtn">‹ Playlist</button>
       <div class="pl-head"><h2>${esc(p.name)}</h2><button class="pill accent" id="playPl">▶ Riproduci</button></div>`;
    h+=list.length?list.map(s=>songRow(s,'pl')).join(''):`<div class="empty">Playlist vuota. Aggiungi brani dal menu ⋮ nella scheda Brani.</div>`;
  }
  if(!persistent) h+=`<div class="note">Il salvataggio non è disponibile qui: i brani restano finché la pagina è aperta.</div>`;
  L.innerHTML=h;
  bind();
}
function bind(){
  const L=$('list');
  L.querySelectorAll('.row[data-id]').forEach(r=>r.onclick=e=>{
    if(e.target.closest('.more')) return;
    const ctx=r.dataset.ctx;
    const ids=ctx==='pl'?playlists.find(p=>p.id===view.playlist).songIds.filter(id=>songs.some(s=>s.id===id))
      :filtered([...songs].sort((a,b)=>a.title.localeCompare(b.title))).map(s=>s.id);
    playFrom(ids,r.dataset.id);
  });
  L.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();songMenu(b.dataset.more);});
  L.querySelectorAll('.row[data-pl]').forEach(r=>r.onclick=e=>{if(e.target.closest('.more'))return;view.playlist=r.dataset.pl;$('search').value='';render();});
  L.querySelectorAll('[data-plmore]').forEach(b=>b.onclick=e=>{e.stopPropagation();plMenu(b.dataset.plmore);});
  const pa=$('playAll'); if(pa) pa.onclick=()=>{const ids=[...songs].sort((a,b)=>a.title.localeCompare(b.title)).map(s=>s.id);playFrom(ids,shuffle?ids[Math.floor(Math.random()*ids.length)]:ids[0]);};
  const np=$('newPl'); if(np) np.onclick=()=>askName('Nuova playlist','',async name=>{const p={id:uid(),name,songIds:[]};await store.put('playlists',p);playlists.push(p);render();});
  const bb=$('backBtn'); if(bb) bb.onclick=()=>{view.playlist=null;render();};
  const pp=$('playPl'); if(pp) pp.onclick=()=>{const p=playlists.find(x=>x.id===view.playlist);const ids=p.songIds.filter(id=>songs.some(s=>s.id===id));if(ids.length)playFrom(ids,shuffle?ids[Math.floor(Math.random()*ids.length)]:ids[0]);};
}

/* ---------- Menu ---------- */
function openSheet(html){$('sheet').innerHTML=html;$('shade').classList.add('on');}
function closeSheet(){$('shade').classList.remove('on');}
$('shade').onclick=e=>{if(e.target.id==='shade')closeSheet();};

function songMenu(id){
  const s=songs.find(x=>x.id===id); if(!s) return;
  const inPl=view.playlist;
  openSheet(`<h3>${esc(s.title)}</h3>
    <button class="opt" data-a="next">⏭  Riproduci dopo</button>
    <button class="opt" data-a="addpl">➕  Aggiungi a playlist</button>
    <button class="opt" data-a="edit">✏️  Modifica titolo e artista</button>
    ${inPl?'<button class="opt" data-a="up">⬆️  Sposta su</button><button class="opt" data-a="down">⬇️  Sposta giù</button><button class="opt danger" data-a="rmpl">➖  Togli dalla playlist</button>':''}
    <button class="opt danger" data-a="del">🗑  Elimina brano</button>`);
  $('sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.a;
    if(a==='next'){ if(qi<0){playFrom([id],id);} else {queue.splice(qi+1,0,id);toast('Verrà riprodotto dopo');} closeSheet(); }
    if(a==='addpl') pickPlaylist(id);
    if(a==='edit') editSong(s);
    if(a==='up'||a==='down'){const p=playlists.find(x=>x.id===inPl);const i=p.songIds.indexOf(id);const j=a==='up'?i-1:i+1;
      if(j>=0&&j<p.songIds.length){[p.songIds[i],p.songIds[j]]=[p.songIds[j],p.songIds[i]];await store.put('playlists',p);}closeSheet();render();}
    if(a==='rmpl'){const p=playlists.find(x=>x.id===inPl);p.songIds=p.songIds.filter(x=>x!==id);await store.put('playlists',p);closeSheet();render();toast('Tolto dalla playlist');}
    if(a==='del') confirmBox(`Eliminare “${esc(s.title)}”?`,'Verrà tolto anche da tutte le playlist.',async()=>{
      await store.del('songs',id);songs=songs.filter(x=>x.id!==id);
      for(const p of playlists){if(p.songIds.includes(id)){p.songIds=p.songIds.filter(x=>x!==id);await store.put('playlists',p);}}
      const wasCurrent=queue[qi]===id; const pos=queue.indexOf(id);
      queue=queue.filter(x=>x!==id); if(pos>-1&&pos<qi)qi--;
      if(wasCurrent){ if(queue.length){qi=Math.min(qi,queue.length-1);loadAndPlay();} else stopAll(); }
      render();toast('Brano eliminato');});
  });
}
function plMenu(id){
  const p=playlists.find(x=>x.id===id);
  openSheet(`<h3>${esc(p.name)}</h3>
    <button class="opt" data-a="ren">✏️  Rinomina</button>
    <button class="opt danger" data-a="del">🗑  Elimina playlist</button>`);
  $('sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='ren') askName('Rinomina playlist',p.name,async n=>{p.name=n;await store.put('playlists',p);render();});
    else confirmBox(`Eliminare “${esc(p.name)}”?`,'I brani restano nella tua libreria.',async()=>{await store.del('playlists',id);playlists=playlists.filter(x=>x.id!==id);render();});
  });
}
function pickPlaylist(songId){
  openSheet(`<h3>Aggiungi a…</h3>
    <button class="opt" data-new="1">＋  Nuova playlist</button>
    ${playlists.map(p=>`<button class="opt" data-p="${p.id}">♫  ${esc(p.name)} <span class="sub" style="margin-left:auto">${p.songIds.includes(songId)?'già presente':''}</span></button>`).join('')}`);
  $('sheet').querySelector('[data-new]').onclick=()=>askName('Nuova playlist','',async name=>{const p={id:uid(),name,songIds:[songId]};await store.put('playlists',p);playlists.push(p);render();toast('Aggiunto a '+name);});
  $('sheet').querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{
    const p=playlists.find(x=>x.id===b.dataset.p);
    if(!p.songIds.includes(songId)){p.songIds.push(songId);await store.put('playlists',p);toast('Aggiunto a '+p.name);} else toast('Già nella playlist');
    closeSheet();render();});
}
function askName(title,val,cb){
  openSheet(`<h3>${title}</h3><input class="field" id="nameIn" value="${esc(val)}" placeholder="Nome">
    <div class="actions"><button class="pill" id="cx">Annulla</button><button class="pill accent" id="ok">Salva</button></div>`);
  const i=$('nameIn'); setTimeout(()=>i.focus(),50);
  const go=()=>{const v=i.value.trim();if(!v)return;closeSheet();cb(v);};
  $('ok').onclick=go; i.onkeydown=e=>{if(e.key==='Enter')go();}; $('cx').onclick=closeSheet;
}
function editSong(s){
  openSheet(`<h3>Modifica brano</h3>
    <input class="field" id="tIn" value="${esc(s.title)}" placeholder="Titolo">
    <input class="field" id="aIn" value="${esc(s.artist)}" placeholder="Artista">
    <div class="actions"><button class="pill" id="cx">Annulla</button><button class="pill accent" id="ok">Salva</button></div>`);
  $('cx').onclick=closeSheet;
  $('ok').onclick=async()=>{s.title=$('tIn').value.trim()||s.title;s.artist=$('aIn').value.trim();await store.put('songs',s);closeSheet();render();updatePlayerInfo();};
}
function confirmBox(title,text,cb){
  openSheet(`<h3>${title}</h3><p class="sub" style="margin:0 6px 14px;white-space:normal">${text}</p>
    <div class="actions"><button class="pill" id="cx">Annulla</button><button class="pill accent" id="ok" style="background:#ff6b6b">Elimina</button></div>`);
  $('cx').onclick=closeSheet; $('ok').onclick=()=>{closeSheet();cb();};
}

/* ---------- Lettore ---------- */
function playFrom(ids,startId){
  queue=[...ids];
  if(shuffle){queue=queue.filter(x=>x!==startId);for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}queue.unshift(startId);}
  qi=queue.indexOf(startId); loadAndPlay();
}
/* analizzatore: legge il volume della musica per lo sfondo */
let actx=null,analyser=null,fbuf=null;
function ensureAnalyser(){
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      actx=new AC();const src=actx.createMediaElementSource(audio);analyser=actx.createAnalyser();
      analyser.fftSize=256;analyser.smoothingTimeConstant=.6;fbuf=new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);analyser.connect(actx.destination);}
    if(actx.state==='suspended')actx.resume();
  }catch(e){}
}
window.musicFx={read(){
  if(!analyser||audio.paused)return {level:0,bass:0,playing:false};
  analyser.getByteFrequencyData(fbuf);let b=0,a=0;
  for(let i=1;i<7;i++)b+=fbuf[i];for(let i=0;i<fbuf.length;i++)a+=fbuf[i];
  return {bass:b/6/255,level:a/fbuf.length/255,playing:true};
}};
function loadAndPlay(){
  ensureAnalyser();
  const s=songs.find(x=>x.id===queue[qi]); if(!s) return;
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl=URL.createObjectURL(s.blob); audio.src=currentUrl;
  audio.play().catch(()=>{}); updatePlayerInfo(); render();
}
function stopAll(){audio.pause();audio.removeAttribute('src');queue=[];qi=-1;$('player').classList.add('hidden');}
/* ---------- Modalità Calamaro DJ ---------- */
let wakeLock=null,djIdleT=null;
function djUpdate(){
  const s=songs.find(x=>x.id===queue[qi]);
  $('djTitle').textContent=s?s.title:'Premi ▶ per far ballare il calamaro';
  $('djSub').textContent=s?(s.artist||'Artista sconosciuto'):'';
  $('djPlay').innerHTML=audio.paused?PLAY:PAUSE;
}
function djWake(){
  $('dj').classList.remove('idle');clearTimeout(djIdleT);
  djIdleT=setTimeout(()=>$('dj').classList.add('idle'),3500);
}
async function djEnter(){
  window.djMode=true;document.body.classList.add('dj-on');closeSheet();djUpdate();djWake();
  try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();}catch(e){}
  try{if(navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}  // schermo sempre acceso
}
function djExit(){
  window.djMode=false;document.body.classList.remove('dj-on');clearTimeout(djIdleT);
  try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
  try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}
}
$('djBtn').onclick=djEnter;
$('djExit').onclick=e=>{e.stopPropagation();djExit();};
$('djPlay').onclick=e=>{e.stopPropagation();djWake();
  if(qi<0){const ids=[...songs].sort((a,b)=>a.title.localeCompare(b.title)).map(x=>x.id);if(ids.length)playFrom(ids,shuffle?ids[Math.floor(Math.random()*ids.length)]:ids[0]);return;}
  ensureAnalyser();if(audio.paused)audio.play().catch(()=>{});else audio.pause();};
$('djNext').onclick=e=>{e.stopPropagation();djWake();next(false);};
$('djPrev').onclick=e=>{e.stopPropagation();djWake();prev();};
document.addEventListener('pointerdown',()=>{if(window.djMode)djWake();},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&window.djMode)djExit();});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&window.djMode&&!wakeLock){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}});
audio.addEventListener('play',djUpdate);audio.addEventListener('pause',djUpdate);

function updatePlayerInfo(){
  setTimeout(djUpdate,0);
  const s=songs.find(x=>x.id===queue[qi]); if(!s) return;
  $('player').classList.remove('hidden');
  $('pTitle').textContent=s.title; $('pSub').textContent=s.artist||'Artista sconosciuto';
  $('pCover').style.cssText=coverStyle(s.title); $('pCover').textContent=(s.title[0]||'♪').toUpperCase();
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||'',album:'La mia musica'});}catch(e){}}
}
function next(auto){
  if(!queue.length) return;
  if(auto&&repeat==='one'){audio.currentTime=0;audio.play();return;}
  if(qi<queue.length-1) qi++;
  else if(repeat==='all'||!auto) qi=0;
  else {audio.pause();return;}
  loadAndPlay();
}
function prev(){ if(audio.currentTime>3){audio.currentTime=0;return;} qi=qi>0?qi-1:queue.length-1; loadAndPlay(); }

$('playBtn').innerHTML=PLAY;
$('playBtn').onclick=()=>{ ensureAnalyser(); if(audio.paused) audio.play().catch(()=>{}); else audio.pause(); };
$('nextBtn').onclick=()=>next(false);
$('prevBtn').onclick=prev;
$('shuffleBtn').onclick=()=>{shuffle=!shuffle;$('shuffleBtn').classList.toggle('on',shuffle);
  if(queue.length){const cur=queue[qi];const rest=queue.filter(x=>x!==cur);if(shuffle){for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}}queue=[cur,...rest];qi=0;}
  toast(shuffle?'Casuale attivo':'Casuale disattivato');saveSettings();};
$('repeatBtn').onclick=()=>{repeat=repeat==='off'?'all':repeat==='all'?'one':'off';paintRepeat();toast({off:'Ripeti disattivato',all:'Ripeti tutto',one:'Ripeti brano'}[repeat]);saveSettings();};
function paintRepeat(){$('repeatBtn').classList.toggle('on',repeat!=='off');$('rep1').textContent=repeat==='one'?'1':'';}

audio.onplay=()=>{$('playBtn').innerHTML=PAUSE;try{navigator.mediaSession.playbackState='playing';}catch(e){}};
audio.onpause=()=>{$('playBtn').innerHTML=PLAY;try{navigator.mediaSession.playbackState='paused';}catch(e){}};
audio.onended=()=>next(true);
let seeking=false;
audio.ontimeupdate=()=>{ if(seeking)return; const d=audio.duration||0;
  $('seek').value=d?audio.currentTime/d*1000:0; $('tCur').textContent=fmt(audio.currentTime); $('tDur').textContent=fmt(d); };
$('seek').oninput=()=>{seeking=true;$('tCur').textContent=fmt($('seek').value/1000*(audio.duration||0));};
$('seek').onchange=()=>{if(audio.duration)audio.currentTime=$('seek').value/1000*audio.duration;seeking=false;};

if('mediaSession' in navigator){
  const ms=navigator.mediaSession;
  try{
    ms.setActionHandler('play',()=>{ensureAnalyser();audio.play();});
    ms.setActionHandler('pause',()=>audio.pause());
    ms.setActionHandler('nexttrack',()=>next(false));
    ms.setActionHandler('previoustrack',prev);
    ms.setActionHandler('seekto',d=>{audio.currentTime=d.seekTime;});
  }catch(e){}
}

function saveSettings(){try{localStorage.setItem('mm-settings',JSON.stringify({shuffle,repeat}));}catch(e){}}
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('mm-settings')||'{}');shuffle=!!s.shuffle;repeat=s.repeat||'off';}catch(e){}
  $('shuffleBtn').classList.toggle('on',shuffle);paintRepeat();}

(async()=>{
  await openDB();
  try{ songs=await store.all('songs')||[]; playlists=(await store.all('playlists')||[]).sort((a,b)=>a.name.localeCompare(b.name)); }catch(e){songs=[];playlists=[];}
  songs.forEach(s=>mem.songs.set(s.id,s)); playlists.forEach(p=>mem.playlists.set(p.id,p));
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  loadSettings(); render();
  await removeTests();
})();
</script>

<script>

let party=0,hueBase=300,ledStep=0;
let night=0,dusk=0,nightInit=false;
function skyTarget(){
  // 0 = giorno pieno, 1 = notte. Tramonto 18-21, alba 5-7.
  const mode=window.nightMode||'auto';
  if(mode==='day')return [0,0];
  if(mode==='dusk')return [.5,1];
  if(mode==='night')return [1,0];
  const d=new Date(),h=d.getHours()+d.getMinutes()/60;
  if(h>=7&&h<18)return [0,0];
  if(h>=18&&h<21){const p=(h-18)/3;return [p,Math.sin(Math.PI*p)];}
  if(h>=5&&h<7){const p=(h-5)/2;return [1-p,Math.sin(Math.PI*p)];}
  return [1,0];
}
function updateSky(dt){
  const [n,d]=skyTarget();
  if(!nightInit||dt===0){night=n;dusk=d;nightInit=true;}
  else{const k=Math.min(1,dt*.8);night+=(n-night)*k;dusk+=(d-dusk)*k;}
  abyss=Math.max(0,Math.min(1,(night-.35)/.5));abyss=abyss*abyss*(3-2*abyss);
  try{document.documentElement.style.setProperty('--night',night.toFixed(3));}catch(e){}
}
let darkCv=null,dctx=null;

const Q={dpr:[2,1.5,1,.75],squids:[7,6,4,3],schools:[4,4,3,2],jellies:[3,3,3,2],anglers:[2,2,2,1],motes:[50,45,30,20],mask:[.6,.5,.35,.3]};
const QNAME=['massima','alta','media','bassa'];
let perfT=0,perfN=0,warm=2,goodT=0,upTries=0;
function newMote(){return {x:rnd(0,W),y:rnd(0,H),r:rnd(.6,1.8),v:rnd(3,9),o:rnd(.15,.45),glow:Math.random()<.3,tw:rnd(0,TAU)};}
function fitPopulation(){
  const nS=Math.min(Q.squids[QL],Math.max(3,Math.round(W*H/110000)));
  squids.length=Math.min(squids.length,nS);while(squids.length<nS)squids.push(newSquid(true));squids.sort((a,b)=>a.size-b.size);
  schools.length=Math.min(schools.length,Q.schools[QL]);while(schools.length<Q.schools[QL])schools.push(newSchool(true));
  jellies.length=Math.min(jellies.length,Q.jellies[QL]);while(jellies.length<Q.jellies[QL])jellies.push(newJelly(true));

function setQuality(q,why){
  q=Math.max(0,Math.min(3,q));if(q===QL)return;
  QL=q;try{localStorage.setItem('mm-q',String(q));}catch(e){}
  applyQualityCss();resize();fitPopulation();darkCv=null;warm=1;perfT=perfN=0;goodT=0;
  try{if(typeof toast==='function')toast('Grafica: qualità '+QNAME[q]);}catch(e){}
}
function watchPerf(dt){
  if(dt<=0||dt>=.25)return;                     // salti dovuti a pause o schede nascoste
  perfT+=dt;perfN++;
  if(perfT<2)return;
  const fps=perfN/perfT;perfT=0;perfN=0;
  window.mmFps=Math.round(fps);
  if(warm>0){warm--;return;}
  if(fps<46&&QL<3){setQuality(QL+1);}
  else if(fps>57&&QL>0&&upTries<2){goodT+=2;if(goodT>=16){upTries++;setQuality(QL-1);}}
  else goodT=0;
}

let abyss=0,darkSprite=null,abyssBed=null,bedGlows=[],anglers=[],smoke=[],smokeT=0,glows=[],chimney=null;
const AG=(x,y,r,c,a,light)=>glows.push({x,y,r,c,a,light});
function buildAbyss(){
  const top=Math.floor(floorY-190),h=H-top,c=document.createElement('canvas');
  c.width=Math.ceil(W*DPR);c.height=Math.ceil(h*DPR);
  const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,-top*DPR);
  sd=31;bedGlows=[];
  // fango scuro
  const g=x.createLinearGradient(0,floorY-20,0,H);g.addColorStop(0,'#1a2230');g.addColorStop(1,'#05070c');
  x.beginPath();x.moveTo(0,H);for(let px=0;px<=W+8;px+=8)x.lineTo(px,groundAt(px)+4);x.lineTo(W,H);x.closePath();x.fillStyle=g;x.fill();
  // rocce nere frastagliate
  x.fillStyle='#070a10';
  for(let i=0;i<6;i++){const cx=srnd(-30,W+30),b=groundAt(cx)+8,w=srnd(30,80),hh=srnd(30,110);
    x.beginPath();x.moveTo(cx-w,b);let px=cx-w;
    for(let k=1;k<=6;k++){px=cx-w+k*w/3;x.lineTo(px,b-hh*(k===3?1:srnd(.3,.85)));}
    x.lineTo(cx+w,b);x.fill();}
  // camino idrotermale
  const cx=W*.8,cb=groundAt(cx)+6,ch=Math.min(150,H*.17);
  x.fillStyle='#0d1016';x.beginPath();x.moveTo(cx-34,cb);x.lineTo(cx-12,cb-ch);x.lineTo(cx+10,cb-ch);x.lineTo(cx+30,cb);x.fill();
  x.fillStyle='#161b24';for(let k=0;k<5;k++){x.beginPath();x.ellipse(cx+srnd(-14,12),cb-srnd(10,ch-10),srnd(6,12),srnd(3,6),0,0,TAU);x.fill();}
  chimney={x:cx-1,y:cb-ch};
  bedGlows.push({x:cx,y:cb-ch+4,r:5,c:'255,120,40',p:0});
  // penne di mare e coralli luminosi (le luci vere sono disegnate dopo)
  const cols=['80,255,230','255,80,220','120,160,255','160,255,120'];
  for(let i=0;i<Math.max(5,Math.round(W/70));i++){const px=srnd(10,W-10),py=groundAt(px)+4,hh=srnd(22,46),col=cols[i%cols.length];
    x.strokeStyle='#202838';x.lineWidth=2.5;x.beginPath();x.moveTo(px,py);x.lineTo(px,py-hh);x.stroke();
    for(let k=0;k<5;k++){const yy=py-hh*(.35+k*.14);
      x.strokeStyle='#283246';x.lineWidth=1.5;x.beginPath();x.moveTo(px-7,yy+4);x.lineTo(px,yy);x.lineTo(px+7,yy+4);x.stroke();
      bedGlows.push({x:px+(k%2?5:-5),y:yy+2,r:1.6,c:col,p:srnd(0,TAU),tiny:true});}
    bedGlows.push({x:px,y:py-hh,r:3,c:col,p:srnd(0,TAU)});}
  abyssBed={c,top};
}
function newAngler(anywhere){
  const dir=Math.random()<.5?1:-1;
  return {dir,x:anywhere?rnd(40,W-40):(dir>0?-80:W+80),y:rnd(H*.25,floorY-60),sp:rnd(10,18),ph:rnd(0,TAU),size:rnd(24,36),vx:0,vy:0};
}
function drawAngler(a,i,dt){
  const dec=Math.exp(-2*dt);a.vx*=dec;a.vy*=dec;a.ph+=dt;
  a.x+=(a.dir*a.sp+a.vx+flowX*.3)*dt;a.y+=(Math.sin(a.ph*.7)*6+a.vy+flowY*.3)*dt;
  if(a.x<-140||a.x>W+140){anglers[i]=newAngler(false);return;}
  const s=a.size,mouth=.25+.15*Math.max(0,Math.sin(a.ph*1.3));
  ctx.save();ctx.translate(a.x,a.y);ctx.scale(a.dir,1);ctx.globalAlpha=abyss;
  // coda
  const wag=Math.sin(a.ph*4)*.3;ctx.fillStyle='#1b1f2b';
  ctx.save();ctx.translate(-s*.85,0);ctx.rotate(wag);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s*.6,-s*.45);ctx.lineTo(-s*.5,0);ctx.lineTo(-s*.6,s*.45);ctx.fill();ctx.restore();
  // corpo
  const bg=ctx.createRadialGradient(-s*.1,-s*.3,2,0,0,s);bg.addColorStop(0,'#3a3f52');bg.addColorStop(1,'#14161f');
  ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,0,s,s*.78,0,0,TAU);ctx.fill();
  // bocca enorme con denti
  ctx.fillStyle='#050608';ctx.beginPath();ctx.moveTo(s*.98,-s*.05);ctx.quadraticCurveTo(s*.3,s*(.1+mouth),s*.98,s*(.25+mouth*1.2));ctx.closePath();ctx.fill();
  ctx.fillStyle='#e8e4d8';
  for(let k=0;k<5;k++){const tx=s*(.5+k*.11);ctx.beginPath();ctx.moveTo(tx,s*.05);ctx.lineTo(tx+s*.04,s*.2);ctx.lineTo(tx+s*.08,s*.06);ctx.fill();
    ctx.beginPath();ctx.moveTo(tx,s*(.22+mouth));ctx.lineTo(tx+s*.04,s*(.08+mouth));ctx.lineTo(tx+s*.08,s*(.22+mouth));ctx.fill();}
  // occhio
  ctx.fillStyle='#c8d4e6';ctx.beginPath();ctx.arc(s*.45,-s*.3,s*.1,0,TAU);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(s*.48,-s*.3,s*.05,0,TAU);ctx.fill();
  // antenna con lanterna
  const lx=s*1.35+Math.sin(a.ph*1.6)*s*.08,ly=-s*1.05+Math.cos(a.ph*1.3)*s*.06;
  ctx.strokeStyle='#2a2f3e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s*.3,-s*.7);ctx.quadraticCurveTo(s*.8,-s*1.5,lx,ly);ctx.stroke();
  ctx.restore();
  AG(a.x+a.dir*lx,a.y+ly,4,'190,255,240',(.75+.25*Math.sin(a.ph*3))*abyss,true);
}
function drawLantern(x,y,s,dir,ph){
  const wag=Math.sin(ph)*.45;
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  ctx.fillStyle='#121a28';ctx.save();ctx.translate(-s*.75,0);ctx.rotate(wag);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s*.7,-s*.5);ctx.lineTo(-s*.7,s*.5);ctx.closePath();ctx.fill();ctx.restore();
  ctx.fillStyle='#1a2436';ctx.beginPath();ctx.ellipse(0,0,s,s*.42,0,0,TAU);ctx.fill();
  ctx.restore();
  AG(x+dir*s*.55,y-s*.08,1.8,'150,220,255',abyss);                         // occhio
  for(let k=0;k<4;k++)AG(x+dir*s*(.45-k*.32),y+s*.25,1.2,'90,200,255',abyss*(.7+.3*Math.sin(ph*.3+k)));  // fotofori
}
function drawSmoke(dt){
  if(!chimney||abyss<.02)return;
  smokeT-=dt;if(smokeT<=0){smokeT=.07;smoke.push({x:chimney.x+rnd(-4,4),y:chimney.y,r:rnd(5,9),a:.8,vx:rnd(-6,6)});}
  ctx.save();
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.y-=dt*rnd(22,32);p.x+=(p.vx+flowX*.5)*dt;p.r+=dt*9;p.a-=dt*.22;
    if(p.a<=0){smoke.splice(i,1);continue;}
    ctx.fillStyle=`rgba(45,48,58,${p.a*.55*abyss})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
  ctx.restore();
}
function drawGlows(){
  if(!glows.length)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const g of glows){if(g.a<=.01)continue;
    if(!g.tiny&&(QL<2||g.light)){const R=g.r*(g.light?7:4),gr=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,R);
      gr.addColorStop(0,`rgba(${g.c},${.5*g.a})`);gr.addColorStop(1,`rgba(${g.c},0)`);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(g.x,g.y,R,0,TAU);ctx.fill();}
    ctx.fillStyle=`rgba(${g.c},${Math.min(1,g.a*1.1)})`;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,TAU);ctx.fill();}
  ctx.restore();
}

function drawNight(){
  // tramonto: luce calda dall'alto
  if(dusk>.01){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,`rgba(255,110,40,${.38*dusk})`);g.addColorStop(.45,`rgba(220,60,120,${.18*dusk})`);g.addColorStop(1,`rgba(120,40,140,${.08*dusk})`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();}
  if(night<.01)return;
  const mq=Q.mask[QL],mw=Math.ceil(W*mq),mh=Math.ceil(H*mq);
  if(!darkCv||darkCv.width!==mw||darkCv.height!==mh){
    darkCv=document.createElement('canvas');darkCv.width=mw;darkCv.height=mh;dctx=darkCv.getContext('2d');}
  const d=dctx;d.setTransform(mq,0,0,mq,0,0);
  d.globalCompositeOperation='source-over';d.clearRect(0,0,W,H);
  d.fillStyle=`rgba(0,3,12,${.9*night})`;d.fillRect(0,0,W,H);
  // ogni luce toglie buio intorno a sé
  d.globalCompositeOperation='destination-out';
  const hole=(x,y,r,a)=>{if(a<=0)return;const g=d.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(0,0,0,${Math.min(1,a)})`);g.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=g;d.beginPath();d.arc(x,y,r,0,TAU);d.fill();};
  hole(W*.78,-40,H*.45,.35);                                   // luna
  for(const j of jellies)hole(j.x,j.y+j.size*.6,j.size*5.5,.9);  // meduse
  for(const m of motes)if(m.glow)hole(m.x,m.y,16,.25);           // plancton
  for(const g of glows)if(g.light)hole(g.x,g.y,g.r*14,.8*g.a);    // lanterne e coralli abissali
  if(party>.02){
    const P=party,L=.5+music.level*2.2+beat*.6;
    for(const bm of beams()){                                    // fari della festa
      const g=d.createLinearGradient(bm.px,bm.py,bm.ex,bm.ey);
      g.addColorStop(0,`rgba(0,0,0,${Math.min(1,.75*P*L)})`);g.addColorStop(.75,`rgba(0,0,0,${Math.min(.6,.35*P*L)})`);g.addColorStop(1,'rgba(0,0,0,0)');
      d.fillStyle=g;d.beginPath();d.moveTo(bm.px,bm.py);
      d.lineTo(bm.ex+bm.nx*bm.hw*1.2,bm.ey+bm.ny*bm.hw*1.2);d.lineTo(bm.ex-bm.nx*bm.hw*1.2,bm.ey-bm.ny*bm.hw*1.2);d.closePath();d.fill();
      if(bm.dy>.2){const k=(floorY-bm.py)/bm.dy;hole(bm.px+bm.dx*k,floorY+10,k*bm.spread*1.4,.8*P*L);}
    }
    if(bs)hole(bs.x,bs.y,bigSize()*(1+beat*.5),.35*P+.4*beat);  // il calamaro DJ
  }
  for(const wv of waves){const a=wv.str*(1-wv.r/(Math.hypot(W,H)*.85));   // onde delle cuffie
    if(a>.05){d.strokeStyle=`rgba(0,0,0,${a*.4})`;d.lineWidth=30;d.beginPath();d.arc(wv.x,wv.y,wv.r,wv.ang-.8,wv.ang+.8);d.stroke();}}
  ctx.drawImage(darkCv,0,0,W,H);
}
function drawGlow(){
  // plancton luminoso: di notte brilla di più
  ctx.save();ctx.globalCompositeOperation='lighter';
  if(abyss>.01){ctx.fillStyle=`rgba(220,230,240,${.35*abyss})`;for(const m of motes)if(!m.glow)ctx.fillRect(m.x,m.y,m.r+.4,m.r+.4);}
  for(const m of motes){if(!m.glow)continue;
    const a=Math.min(.95,(.25+.35*(.5+.5*Math.sin(m.tw)))*(1+night*1.2)+music.level*.6+beat*.2);
    if(night>.3){const g=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,6);g.addColorStop(0,`rgba(120,255,230,${a*.5*night})`);g.addColorStop(1,'rgba(120,255,230,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(m.x,m.y,6,0,TAU);ctx.fill();}
    ctx.fillStyle=`rgba(120,255,230,${a})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r+.8,0,TAU);ctx.fill();}
  ctx.restore();
}
let bigImg=null,bs=null,waves=[],music={level:0,bass:0,playing:false},beat=0,bassAvg=0,beatCool=0,quietT=0;
let sprites=[],squids=[],bubbles=[],motes=[],schools=[],jellies=[],crabs=[],weeds=[],vents=[];
let turtle=null,turtleWait=3,whale=null,whaleWait=6;
let seabed=null,seabedTop=0,floorY=0,waterGrad=null;
let flowX=0,flowY=0;
const clampF=v=>Math.max(-520,Math.min(520,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let sd=1;const srnd=(a,b)=>{sd=(sd*16807)%2147483647;return a+(sd/2147483647)*(b-a);};
const groundAt=x=>floorY+Math.sin(x*.012)*10+Math.sin(x*.031+1)*5;

/* ---------- impostazione ---------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,Q.dpr[QL]);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  floorY=H*.84;
  waterGrad=ctx.createLinearGradient(0,0,0,H);
  waterGrad.addColorStop(0,'#1784b4');waterGrad.addColorStop(.35,'#0e5383');
  waterGrad.addColorStop(.72,'#092f52');waterGrad.addColorStop(1,'#061a2c');
  buildSeabed();buildWeeds();abyssBed=null;
  vents=[{x:W*.18},{x:W*.77}];
}
function makeSprites(img){
  sprites=TINTS.map(h=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const x=c.getContext('2d');try{x.filter=h;}catch(e){}
    x.drawImage(img,0,0);return c;});
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const x=c.getContext('2d');try{x.filter='brightness(.28) saturate(.4) hue-rotate(200deg)';}catch(e){}
  x.drawImage(img,0,0);darkSprite=c;
}

/* ---------- fondale (disegnato una volta) ---------- */
function buildSeabed(){
  seabedTop=Math.floor(floorY-170);
  const h=H-seabedTop, c=document.createElement('canvas');
  c.width=Math.ceil(W*DPR);c.height=Math.ceil(h*DPR);
  const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,-seabedTop*DPR);
  sd=7;
  // rocce lontane
  x.fillStyle='rgba(8,44,72,.85)';
  for(let i=0;i<7;i++){const cx=srnd(-40,W+40),b=groundAt(cx)+6,w=srnd(50,130),hh=srnd(30,90);
    x.beginPath();x.moveTo(cx-w,b);x.quadraticCurveTo(cx-w*.6,b-hh,cx,b-hh*1.05);x.quadraticCurveTo(cx+w*.7,b-hh*.9,cx+w,b);x.fill();}
  // sabbia
  const g=x.createLinearGradient(0,floorY-20,0,H);
  g.addColorStop(0,'#c4b283');g.addColorStop(.3,'#8f8361');g.addColorStop(1,'#3a372e');
  x.beginPath();x.moveTo(0,H);for(let px=0;px<=W+8;px+=8)x.lineTo(px,groundAt(px));x.lineTo(W,H);x.closePath();
  x.fillStyle=g;x.fill();x.fillStyle='rgba(20,90,130,.28)';x.fill();
  // increspature
  x.strokeStyle='rgba(255,240,200,.14)';x.lineWidth=1.4;x.lineCap='round';
  for(let k=0;k<16;k++){const y0=srnd(floorY+18,H-8),x0=srnd(-40,W),l=srnd(40,110);
    x.beginPath();x.moveTo(x0,y0);x.quadraticCurveTo(x0+l/2,y0-6,x0+l,y0);x.stroke();}
  // sassolini
  for(let k=0;k<34;k++){const px=srnd(0,W),py=srnd(groundAt(px)+6,H);
    x.fillStyle=`rgba(${srnd(70,120)|0},${srnd(80,120)|0},${srnd(90,130)|0},.8)`;
    x.beginPath();x.ellipse(px,py,srnd(1.5,4),srnd(1,2.5),0,0,TAU);x.fill();}
  // rocce vicine
  for(let i=0;i<3;i++){const cx=srnd(0,W),b=groundAt(cx)+8,w=srnd(26,46),hh=srnd(18,34);
    const rg=x.createLinearGradient(0,b-hh,0,b);rg.addColorStop(0,'#5d7383');rg.addColorStop(1,'#2a3a46');
    x.fillStyle=rg;x.beginPath();x.moveTo(cx-w,b);x.bezierCurveTo(cx-w,b-hh,cx+w*.4,b-hh*1.2,cx+w,b);x.fill();
    x.fillStyle='rgba(120,200,120,.35)';x.beginPath();x.ellipse(cx-w*.2,b-hh*.75,w*.35,hh*.15,-.2,0,TAU);x.fill();}
  // coralli ramificati
  const CC=['#ff6f91','#ff9671','#e05a9c','#f9c74f','#ff5e5b','#b388ff'];
  function branch(px,py,len,a,d,col){
    const ex=px+Math.cos(a)*len,ey=py+Math.sin(a)*len;
    x.strokeStyle=col;x.lineWidth=d*1.7+1;x.beginPath();x.moveTo(px,py);x.lineTo(ex,ey);x.stroke();
    if(d>0){branch(ex,ey,len*.74,a-srnd(.25,.6),d-1,col);branch(ex,ey,len*.74,a+srnd(.25,.6),d-1,col);}
    else{x.fillStyle=col;x.beginPath();x.arc(ex,ey,2.2,0,TAU);x.fill();}
  }
  for(let i=0;i<Math.max(4,Math.round(W/90));i++){const cx=srnd(10,W-10);branch(cx,groundAt(cx)+4,srnd(14,24),-Math.PI/2+srnd(-.2,.2),4,CC[i%CC.length]);}
  // coralli a palla
  for(let i=0;i<3;i++){const cx=srnd(0,W),b=groundAt(cx)+4,r=srnd(9,15),col=CC[(i+2)%CC.length];
    x.fillStyle=col;x.beginPath();x.arc(cx,b-r*.6,r,Math.PI,TAU);x.fill();
    x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=1;for(let k=1;k<4;k++){x.beginPath();x.arc(cx,b-r*.6,r*k/4,Math.PI,TAU);x.stroke();}}
  // stelle marine
  for(let i=0;i<3;i++){const cx=srnd(20,W-20),cy=srnd(groundAt(cx)+14,H-14),r=srnd(8,12),rot=srnd(0,TAU);
    x.fillStyle=['#ff8c42','#e85d9c','#b56cff'][i];x.beginPath();
    for(let k=0;k<10;k++){const rr=k%2?r*.42:r,aa=rot+k*Math.PI/5;x.lineTo(cx+Math.cos(aa)*rr,cy+Math.sin(aa)*rr);}
    x.closePath();x.fill();x.fillStyle='rgba(255,255,255,.45)';
    for(let k=0;k<5;k++){const aa=rot+k*TAU/5;x.beginPath();x.arc(cx+Math.cos(aa)*r*.5,cy+Math.sin(aa)*r*.5,1.1,0,TAU);x.fill();}}
  // conchiglie
  for(let i=0;i<3;i++){const cx=srnd(0,W),cy=srnd(groundAt(cx)+10,H-8),r=srnd(5,8);
    x.fillStyle='#f3d9c4';x.beginPath();x.arc(cx,cy,r,Math.PI,TAU);x.closePath();x.fill();
    x.strokeStyle='#c49a7a';x.lineWidth=1;for(let k=-2;k<=2;k++){x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+k*r*.4,cy-r*.9);x.stroke();}}
  seabed=c;
}
function buildWeeds(){

  const cols=['#2d8a4e','#3fa65c','#1f6e48','#5fbf6a','#2a9d8f'];
  for(let i=0;i<n;i++){
    const cl=Math.floor(srnd(0,6)),bx=(cl+.5)*W/6+srnd(-W/14,W/14);
    weeds.push({x:bx,h:srnd(70,Math.min(260,H*.32)),segs:10,w:srnd(5,9),leaves:srnd(0,1)<.45,col:cols[i%cols.length],ph:srnd(0,TAU)});
  }
}

function drawWater(dt){

  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1-night;
  for(let i=0;i<5;i++){
    const cx=W*(i+.5)/5+Math.sin(t*.25+i*1.7)*40,wTop=26+i%2*22,wBot=wTop*4;
    const lg=ctx.createLinearGradient(0,0,0,floorY);

    ctx.fillStyle=lg;ctx.beginPath();const sk=Math.sin(t*.2+i)*60+flowX*.35;
    ctx.moveTo(cx-wTop,0);ctx.lineTo(cx+wTop,0);ctx.lineTo(cx+wBot+sk,floorY);ctx.lineTo(cx-wBot+sk,floorY);ctx.fill();
  }

  ctx.lineTo(W,0);ctx.fill();
}
function drawWhale(dt){

    whale={dir,len,x:dir>0?-len:W+len,y:rnd(H*.22,H*.42),ph:0};}return;}
  const w=whale;w.ph+=dt;w.x+=(w.dir*12+flowX*.15)*dt;w.y+=flowY*.15*dt;
  if(w.x<-w.len*1.6||w.x>W+w.len*1.6){whale=null;whaleWait=rnd(18,35);return;}
  const L=w.len,tail=Math.sin(w.ph*.9)*.25;
  ctx.save();ctx.translate(w.x,w.y+Math.sin(w.ph*.4)*6);ctx.scale(w.dir,1);ctx.fillStyle='rgba(3,22,40,.32)';

  ctx.lineTo(-L*.5,L*.02);ctx.bezierCurveTo(-L*.1,L*.1,L*.35,L*.16,L*.5,0);ctx.fill();
  ctx.save();ctx.translate(-L*.5,0);ctx.rotate(tail);

  ctx.restore();

function smoothPath(pts,move){
  // curva morbida che passa per i punti medi
  if(move)ctx.moveTo(pts[0][0],pts[0][1]);else ctx.lineTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}
  const l=pts[pts.length-1];ctx.lineTo(l[0],l[1]);
}
function drawWeeds(dt){
  const target0=Math.max(-.9,Math.min(.9,flowX*.0013));
  for(let wi=0;wi<weeds.length;wi++){const w=weeds[wi];if(QL>=3&&wi%2)continue;
    // piegamento con una molla: si muove morbido e oscilla un po' prima di fermarsi
    const target=target0+beat*.18*Math.sin(w.ph*3);
    w.bv=(w.bv||0)+(target-(w.bend||0))*7*dt; w.bv*=Math.exp(-2.2*dt); w.bend=(w.bend||0)+w.bv*dt;
    w.sp=(w.sp||0)+dt*(1+music.level*1.6);
    w.wobA=(w.wobA||0)*Math.exp(-1.6*dt);w.wobP=(w.wobP||0)+dt*7;
    const n=16,seg=w.h/n,amp=.28*(1+music.level*1.5);
    let x=w.x,y=groundAt(w.x)+4;
    const mid=[[x,y]],L=[],R=[];
    for(let i=0;i<=n;i++){
      const f=i/n;
      const ang=-Math.PI/2+w.bend*f*f*1.3+Math.sin(w.sp*1.2+w.ph-f*2.6)*amp*f+w.wobA*Math.sin(w.wobP-f*3.5)*f;
      if(i>0){x+=Math.cos(ang)*seg;y+=Math.sin(ang)*seg;mid.push([x,y]);}
      const hw=w.w*(1-f*.8)*.5*(1+.15*Math.sin(f*9+w.ph)),nx=-Math.sin(ang),ny=Math.cos(ang);
      L.push([x+nx*hw,y+ny*hw]);R.push([x-nx*hw,y-ny*hw]);
    }
    // nastro affusolato con punta arrotondata
    ctx.beginPath();smoothPath(L,true);
    const tip=mid[mid.length-1];ctx.arc(tip[0],tip[1],w.w*.1+.5,0,TAU);
    smoothPath(R.reverse(),false);ctx.closePath();
    ctx.fillStyle=w.col;ctx.fill();
    // foglioline tonde lungo lo stelo
    if(w.leaves){ctx.fillStyle=w.col;
      for(let k=3;k<n-1;k+=3){const p=mid[k],q=mid[k+1],an=Math.atan2(q[1]-p[1],q[0]-p[0]),side=k%2?1:-1;
        ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(an+side*(.9+.15*Math.sin(w.sp*1.5+k)));
        ctx.beginPath();ctx.ellipse(w.w*1.1,0,w.w*1.2,w.w*.5,0,0,TAU);ctx.fill();ctx.restore();}}
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle='rgba(190,255,200,.28)';ctx.lineWidth=Math.max(1,w.w*.22);
    ctx.beginPath();smoothPath(mid,true);ctx.stroke();
  }
}

  for(let side=-1;side<=1;side+=2){ctx.strokeStyle='#c2412b';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(side*s*.25,-s*.95);ctx.lineTo(side*s*.3,-s*1.35);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(side*s*.3,-s*1.42,s*.17,0,TAU);ctx.fill();

function drawSchool(sc,i,dt){
  sc.x+=(sc.dir*sc.sp+flowX*.4)*dt;sc.y+=(Math.sin(t*.6+sc.wob)*12+flowY*.4)*dt;
  sc.y=Math.max(40,Math.min(floorY-30,sc.y));
  if((sc.dir>0&&sc.x>W+140)||(sc.dir<0&&sc.x<-140)||sc.x<-260||sc.x>W+260){schools[i]=newSchool(false);return;}
  const dec=Math.exp(-2.5*dt);
  for(const f of sc.fish){
    f.vx+=(f.hx-f.ox)*3*dt;f.vy+=(f.hy-f.oy)*3*dt;f.vx*=dec;f.vy*=dec;f.ox+=f.vx*dt;f.oy+=f.vy*dt;
    f.ph+=dt*(9+Math.hypot(f.vx,f.vy)*.05);
    const fx=sc.x+f.ox,fy=sc.y+f.oy+Math.sin(t*2+f.ph*.2)*2;
    const dir=Math.abs(f.vx)>60?Math.sign(f.vx):sc.dir;
    if(abyss<.99){ctx.globalAlpha=1-abyss;drawFish(fx,fy,f.s,dir,f.ph,sc.pal);ctx.globalAlpha=1;}
    if(abyss>.01){ctx.globalAlpha=abyss;drawLantern(fx,fy,f.s,dir,f.ph);ctx.globalAlpha=1;}
  }
}

}
function drawTurtle(dt){

function drawSquid(s,dt){

  if(abyss>.01&&darkSprite){ctx.globalAlpha=al*abyss;ctx.drawImage(darkSprite,-w/2,-h/2,w,h);}
  ctx.restore();

}

  }
}
function drawMotes(dt){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const m of motes){m.y-=m.v*dt*(m.glow?1:1-2*abyss);m.x+=flowX*.8*dt;m.y+=flowY*.8*dt;m.tw+=dt*2;
    if(m.y<0)m.y+=H;if(m.y>H)m.y-=H;if(m.x<0)m.x+=W;if(m.x>W)m.x-=W;
    if(m.glow){}
    else{ctx.fillStyle=`rgba(200,230,255,${m.o})`;ctx.fillRect(m.x,m.y,m.r,m.r);}}
  ctx.restore();
}
function drawCaustics(){
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(200,255,240,.07)';ctx.lineWidth=2;
  for(let k=0;k<7;k++){const cx=(k+.5)*W/7+Math.sin(t*.7+k)*18,cy=groundAt(cx)+18+(k%3)*14;
    ctx.beginPath();ctx.ellipse(cx,cy,22+Math.sin(t*1.3+k)*6,6+Math.cos(t+k)*2,Math.sin(t*.4+k)*.3,0,TAU);ctx.stroke();}
  ctx.restore();
}
/* ---------- calamaro grande con occhiali e cuffie ---------- */
function newBig(){return {x:W*.5,y:H*.52,vx:0,vy:0,ph:0};}
let djK=0,tiltX=0,tiltY=0,tiltTX=0,tiltTY=0,tiltBase=null;
addEventListener('deviceorientation',e=>{
  if(e.gamma==null||e.beta==null)return;
  if(tiltBase===null)tiltBase=e.beta;
  tiltBase+=(e.beta-tiltBase)*.002;                         // si adatta piano a come tieni il telefono
  tiltTX=Math.max(-1,Math.min(1,e.gamma/28));
  tiltTY=Math.max(-1,Math.min(1,(e.beta-tiltBase)/22));
});
function bigSize(){const n=Math.min(H*.2,W*.38,170),d=Math.min(H*.42,W*.78,380);return n+(d-n)*djK;}
function bigCups(){
  // posizione delle cuffie nel mondo (sinistra, destra)
  const h=bigSize(),w=h*(bigImg?bigImg.width/bigImg.height:.8),a=bs.rot||0,sc=bs.sc||1;
  const loc=[[-w*.40,-h*.04],[w*.40,-h*.04]];
  return loc.map(([lx,ly],i)=>({x:bs.x+(Math.cos(a)*lx-Math.sin(a)*ly)*sc,y:bs.y+(Math.sin(a)*lx+Math.cos(a)*ly)*sc,ang:a+(i?0:Math.PI)}));
}
function updateMusic(dt){
  party+=((music.playing?1:0)-party)*Math.min(1,dt*2.5);
  music=(window.musicFx&&window.musicFx.read())||{level:0,bass:0,playing:false};
  beat*=Math.exp(-5*dt);beatCool-=dt;
  if(!music.playing){bassAvg*=Math.exp(-dt);return;}
  bassAvg+=(music.bass-bassAvg)*Math.min(1,dt*2.5);
  quietT+=dt;
  const hit=music.bass>bassAvg*1.15+.03&&beatCool<=0;
  const filler=quietT>.7&&music.level>.04&&beatCool<=0;
  if(hit||filler){
    const str=hit?Math.min(1,.45+(music.bass-bassAvg)*5):.35;
    beat=Math.max(beat,str);beatCool=.24;quietT=0;
    if(hit){hueBase=(hueBase+70)%360;ledStep++;}
    if(bs)for(const c of bigCups())waves.push({x:c.x,y:c.y,ang:c.ang,r:bigSize()*.08,str});
  }
}
function drawBig(dt){
  if(!bigImg)return;
  if(!bs)bs=newBig();
  bs.ph+=dt;
  djK+=((window.djMode?1:0)-djK)*Math.min(1,dt*2);
  tiltX+=(tiltTX-tiltX)*Math.min(1,dt*4);tiltY+=(tiltTY-tiltY)*Math.min(1,dt*4);
  const hx=W*.5+Math.sin(bs.ph*.23)*W*.16*(1-djK*.7)+tiltX*W*.32,hy=H*(.5-djK*.06)+Math.sin(bs.ph*.37)*H*.07*(1-djK*.5)+tiltY*H*.22;
  const dec=Math.exp(-1.6*dt);
  bs.vx+=(hx-bs.x)*1.4*dt+flowX*.25*dt;bs.vy+=(hy-bs.y)*1.4*dt+flowY*.25*dt;bs.vx*=dec;bs.vy*=dec;
  bs.x+=bs.vx*dt;bs.y+=bs.vy*dt;
  const dance=music.playing?1:0;
  bs.rot=Math.sin(bs.ph*1.1)*.06+dance*Math.sin(bs.ph*5)*.06*(.4+music.level*2)+Math.max(-.25,Math.min(.25,bs.vx*.002));
  bs.sc=1+beat*.07;
  { // bolle: più si muove (o balla), più bolle fa
    const h0=bigSize(),w0=h0*bigImg.width/bigImg.height,spd=Math.hypot(bs.vx,bs.vy);
    bs.bt=(bs.bt??.5)-dt*(.18+spd*.02+beat*1.4+(music.playing?music.level*1.5:0));
    if(bs.bt<=0){bs.bt=1;
      const n=1+Math.floor(Math.min(2,spd*.012+beat));
      for(let k=0;k<n;k++){const lx=rnd(-w0*.32,w0*.32),ly=h0*rnd(.38,.48),a=bs.rot||0;
        bubbles.push(newBubble(bs.x+Math.cos(a)*lx-Math.sin(a)*ly,bs.y+Math.sin(a)*lx+Math.cos(a)*ly,Math.random()<.6));}
      if(spd>40)for(let k=0;k<2;k++){const ox=-bs.vx/spd*h0*.4,oy=-bs.vy/spd*h0*.4;   // scia dietro
        bubbles.push(newBubble(bs.x+ox+rnd(-10,10),bs.y+oy+rnd(-10,10),true));}
    }
  }
  const h=bigSize(),w=h*bigImg.width/bigImg.height,sq=Math.sin(bs.ph*2.2)*.025+beat*.04;
  // alone caldo a ritmo
  if(beat>.02){const g=ctx.createRadialGradient(bs.x,bs.y,0,bs.x,bs.y,h*1.1);
    g.addColorStop(0,`rgba(255,140,70,${.16*beat})`);g.addColorStop(1,'rgba(255,140,70,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(bs.x,bs.y,h*1.1,0,TAU);ctx.fill();}
  ctx.save();ctx.translate(bs.x,bs.y);ctx.rotate(bs.rot);ctx.scale(bs.sc*(1-sq),bs.sc*(1+sq));
  ctx.drawImage(bigImg,-w/2,-h/2,w,h);
  // cuffie nello stile degli occhiali: nero pieno, forme morbide
  ctx.fillStyle='#000';ctx.strokeStyle='#000';ctx.lineCap='round';
  ctx.lineWidth=h*.045;
  ctx.beginPath();ctx.ellipse(0,-h*.04,w*.40,h*.5,0,Math.PI*1.03,Math.PI*1.97);ctx.stroke();
  const cupW=w*.15,cupH=h*.2,pump=1+beat*.12;
  for(const side of [-1,1]){
    ctx.save();ctx.translate(side*w*.40,-h*.04);ctx.scale(pump,pump);
    // forma a "lente": lato interno dritto, esterno arrotondato
    ctx.beginPath();
    ctx.moveTo(-side*cupW*.15,-cupH*.5);
    ctx.bezierCurveTo(side*cupW*.95,-cupH*.55,side*cupW*.95,cupH*.55,-side*cupW*.15,cupH*.5);
    ctx.bezierCurveTo(-side*cupW*.45,cupH*.3,-side*cupW*.45,-cupH*.3,-side*cupW*.15,-cupH*.5);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawWaves(dt){
  const maxR=Math.hypot(W,H)*.85;
  for(let i=waves.length-1;i>=0;i--){
    const wv=waves[i];wv.r+=dt*230;
    const a=wv.str*(1-wv.r/maxR);
    if(a<=.02){waves.splice(i,1);continue;}
    // le onde spingono tutto quello che incontrano
    const F=wv.str*700*dt;
    const hit=(px,py)=>{const dx=px-wv.x,dy=py-wv.y,d=Math.hypot(dx,dy)||1;
      return Math.abs(d-wv.r)<26?[dx/d*F*(1-wv.r/maxR),dy/d*F*(1-wv.r/maxR)]:null;};
    for(const s of squids){const p=hit(s.x,s.y);if(p){s.vx+=p[0];s.vy+=p[1];}}
    for(const j of jellies){const p=hit(j.x,j.y);if(p){j.vx+=p[0]*.7;j.vy+=p[1]*.7;}}
    if(turtle){const p=hit(turtle.x,turtle.y);if(p){turtle.vx+=p[0]*.5;turtle.vy+=p[1]*.5;}}
    for(const sc of schools)for(const f of sc.fish){const p=hit(sc.x+f.ox,sc.y+f.oy);if(p){f.vx+=p[0]*1.4;f.vy+=p[1]*1.4;}}
    for(const b of bubbles){const p=hit(b.x,b.y);if(p){b.x+=p[0]*.05;b.y+=p[1]*.05;}}
    wv.hitW=wv.hitW||new Set();
    for(let k=0;k<weeds.length;k++){if(wv.hitW.has(k))continue;const w=weeds[k];
      const gy=groundAt(w.x),cy=Math.max(gy-w.h,Math.min(gy,wv.y)),d=Math.hypot(w.x-wv.x,cy-wv.y);
      if(Math.abs(d-wv.r)<22){wv.hitW.add(k);const k2=wv.str*(1-wv.r/maxR);
        w.bv=(w.bv||0)+Math.sign(w.x-wv.x||1)*k2*2.2;    // spinta: si piega e torna indietro
        w.wobA=Math.min(.45,(w.wobA||0)+k2*.35);}}       // vibrazione che si smorza
    // disegno: archi di suono che escono dalla cuffia + anello leggero
    ctx.save();ctx.lineCap='round';
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=`rgba(255,140,70,${a*.18})`;ctx.lineWidth=8;
    ctx.beginPath();ctx.arc(wv.x,wv.y,wv.r,wv.ang-.75,wv.ang+.75);ctx.stroke();
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=`rgba(255,255,255,${a*.45})`;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(wv.x,wv.y,wv.r,wv.ang-.75,wv.ang+.75);ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${a*.07})`;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(wv.x,wv.y,wv.r,0,TAU);ctx.stroke();
    ctx.restore();
  }
}
/* ---------- luci da festa ---------- */
function beams(){
  const xs=[.08,.36,.64,.92],out=[];
  for(let i=0;i<4;i++){
    const px=W*xs[i],py=-6,hue=(hueBase+i*90)%360;
    const a=Math.sin(t*(.7+i*.13)+i*1.9)*.55+(i<2?.12:-.12)+beat*.12*Math.sin(i+t*3);
    const dx=Math.sin(a),dy=Math.cos(a),len=H*1.15,spread=.13+beat*.03;
    out.push({px,py,hue,dx,dy,spread,ex:px+dx*len,ey:py+dy*len,nx:-dy,ny:dx,hw:len*spread});
  }
  return out;
}
function drawParty(dt){
  if(party<.02)return;
  const P=party*(1+night*.6),L=.5+music.level*2.2+beat*.6;
  ctx.save();ctx.globalCompositeOperation='lighter';
  // fari che spazzano l'acqua
  for(const bm of beams()){
    const {px,py,hue,dx,dy,spread,ex,ey,nx,ny,hw}=bm;
    const g=ctx.createLinearGradient(px,py,ex,ey);
    g.addColorStop(0,`hsla(${hue},100%,55%,${Math.min(.65,.34*P*L)})`);g.addColorStop(.7,`hsla(${hue},100%,50%,${Math.min(.25,.12*P*L)})`);g.addColorStop(1,`hsla(${hue},100%,50%,0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(px-nx*3,py-ny*3);ctx.lineTo(px+nx*3,py+ny*3);
    ctx.lineTo(ex+nx*hw,ey+ny*hw);ctx.lineTo(ex-nx*hw,ey-ny*hw);ctx.closePath();ctx.fill();
    // macchia di luce dove il fascio tocca il fondo
    if(dy>.2&&QL<2){const k=(floorY-py)/dy,fx=px+dx*k,r=k*spread*1.1;
      const sg=ctx.createRadialGradient(fx,floorY+10,0,fx,floorY+10,r);
      sg.addColorStop(0,`hsla(${hue},100%,65%,${.28*P*L})`);sg.addColorStop(1,`hsla(${hue},100%,60%,0)`);
      ctx.fillStyle=sg;ctx.save();ctx.translate(fx,floorY+10);ctx.scale(1,.35);ctx.translate(-fx,-(floorY+10));
      ctx.beginPath();ctx.arc(fx,floorY+10,r,0,TAU);ctx.fill();ctx.restore();}
    // faretto
    ctx.fillStyle=`hsla(${hue},100%,80%,${.9*P})`;ctx.beginPath();ctx.arc(px,2,5,0,TAU);ctx.fill();
  }
  // lampo di colore sui colpi di basso
  if(beat>.05){ctx.fillStyle=`hsla(${hueBase},100%,55%,${.07*beat*P})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}
function scene(dt){
  updateMusic(dt);updateSky(dt);
  glows=[];
  drawWater(dt);drawMotes(dt);
  const day=1-abyss;
  if(seabed&&day>.01){ctx.globalAlpha=day;ctx.drawImage(seabed,0,seabedTop,W,H-seabedTop);ctx.globalAlpha=1;}
  if(abyss>.01){if(!abyssBed)buildAbyss();ctx.globalAlpha=abyss;ctx.drawImage(abyssBed.c,0,abyssBed.top,W,H-abyssBed.top);ctx.globalAlpha=1;
    for(const g of bedGlows)AG(g.x,g.y,g.r,g.c,abyss*(.55+.45*Math.sin(t*1.5+g.p)),!g.tiny);}
  drawSmoke(dt);
  if(day>.01){ctx.globalAlpha=day;if(QL<2)drawCaustics();drawWeeds(dt);for(const c of crabs)drawCrab(c,dt);ctx.globalAlpha=1;}
  for(let i=schools.length-1;i>=0;i--)drawSchool(schools[i],i,dt);
  if(day>.01){ctx.globalAlpha=day;drawTurtle(dt);ctx.globalAlpha=1;}
  if(abyss>.01)for(let i=anglers.length-1;i>=0;i--)drawAngler(anglers[i],i,dt);
  for(const s of squids)drawSquid(s,dt);
  drawBig(dt);
  drawNight();drawGlow();drawGlows();
  for(let i=jellies.length-1;i>=0;i--)drawJelly(jellies[i],i,dt);
  drawParty(dt);
  drawWaves(dt);
  drawBubbles(dt);
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  const fd=Math.exp(-2.4*dt);flowX*=fd;flowY*=fd;
  // la corrente si muove da sola, a ondate lente
  const autoX=Math.sin(t*.13)*50+Math.sin(t*.31+1.3)*22+Math.max(0,Math.sin(t*.07))**6*70*Math.sign(Math.sin(t*.05)||1);
  const autoY=Math.sin(t*.19+.5)*18;
  flowX+=(autoX-flowX)*Math.min(1,dt*.9);flowY+=(autoY-flowY)*Math.min(1,dt*.9);
  if(running){t+=dt;scene(dt);watchPerf(dt);requestAnimationFrame(frame);}
}
function staticFrame(){scene(0);}

let on=true;
try{on=localStorage.getItem('mm-fx')!=='off';}catch(e){}
try{if(matchMedia('(prefers-reduced-motion: reduce)').matches&&localStorage.getItem('mm-fx')===null)on=false;}catch(e){}
const btn=document.getElementById('fxBtn');
function start(){running=true;last=performance.now();perfT=perfN=0;warm=Math.max(warm,1);requestAnimationFrame(frame);}
applyQualityCss();
function setFx(v){on=v;btn.classList.toggle('off',!v);try{localStorage.setItem('mm-fx',v?'on':'off');}catch(e){}
  if(v&&!running)start();else if(!v){running=false;staticFrame();}}
btn.onclick=()=>setFx(!on);
window.waterFx={
  push(dx,dy){if(!running)return;flowX=clampF(flowX+dx);flowY=clampF(flowY+dy);},
  touch(x,y){
    if(!running)return;
    const away=(o,R,F)=>{const dx=o.x-x,dy=o.y-y,d=Math.hypot(dx,dy)||1;if(d<R){const f=F*(1-d/R);o.vx+=dx/d*f;o.vy+=dy/d*f;return true;}return false;};
    for(const s of squids)if(away(s,200,380))s.ph+=1.5;
    for(const j of jellies)away(j,170,160);
    if(bs)away(bs,220,160);
    if(turtle)away(turtle,170,150);
    for(const sc of schools)for(const f of sc.fish){const fx=sc.x+f.ox,fy=sc.y+f.oy,dx=fx-x,dy=fy-y,d=Math.hypot(dx,dy)||1;
      if(d<160){const k=420*(1-d/160);f.vx+=dx/d*k;f.vy+=dy/d*k;}}
    for(const c of crabs)if(Math.abs(c.x-x)<130&&y>floorY-80){c.flee=1.3;c.pause=0;c.dir=c.x<x?-1:1;}
    for(let i=0;i<4;i++)bubbles.push(newBubble(x+rnd(-14,14),y+rnd(-14,14),true));
  }
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)running=false;else if(on&&!running)start();});
const img=new Image();
img.onload=()=>{makeSprites(img);resize();init();btn.classList.toggle('off',!on);
  if(on)start();else{running=false;staticFrame();}};
img.src=SQUID_SRC;
const bi=new Image();bi.onload=()=>{bigImg=bi;if(!running)staticFrame();};bi.src=BIG_SRC;
addEventListener('resize',()=>{resize();if(!running)staticFrame();});
})();
</script>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
